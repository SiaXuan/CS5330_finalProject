<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fashion Search</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- ── Initial search screen ─────────────────────────────────── -->
  <div id="search-screen" class="screen active">
    <div class="hero">
      <div class="hero-badge">TIRG · FashionCLIP</div>
      <h1>Fashion Search</h1>
      <p class="hero-sub">Describe what you're looking for to find matching items</p>
      <div class="search-row">
        <input id="initial-text" type="text"
               placeholder="e.g. floral dress with short sleeves" />
        <select id="initial-cat">
          <option value="">All categories</option>
          <option value="dress">Dress</option>
          <option value="shirt">Shirt</option>
          <option value="toptee">Top &amp; Tee</option>
        </select>
        <button id="search-btn">Search</button>
      </div>
    </div>
  </div>

  <!-- ── Results screen ────────────────────────────────────────── -->
  <div id="results-screen" class="screen">
    <div class="results-layout">

      <!-- Left: history trail -->
      <aside id="history-panel">
        <div class="history-title">Search trail</div>
        <div id="history-list"></div>
        <button id="new-search-btn">← New search</button>
      </aside>

      <!-- Right: image grid -->
      <main id="main-panel">
        <div class="results-bar">
          <span id="results-label"></span>
          <span id="results-hint">Click an image to refine</span>
        </div>
        <div id="image-grid"></div>
      </main>

    </div>
  </div>

  <!-- ── Refine modal ───────────────────────────────────────────── -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <button id="modal-close">×</button>
      <div class="modal-inner">
        <div class="modal-ref">
          <img id="modal-img" src="" alt="reference" />
          <span class="ref-tag">Reference</span>
        </div>
        <div class="modal-form">
          <label>How would you like to change it?</label>
          <input id="refine-text" type="text"
                 placeholder='e.g. "make it longer and in dark blue"' />
          <select id="refine-cat">
            <option value="">Same category</option>
            <option value="dress">Dress</option>
            <option value="shirt">Shirt</option>
            <option value="toptee">Top &amp; Tee</option>
          </select>
          <button id="refine-btn">Refine &rarr;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Loading spinner ────────────────────────────────────────── -->
  <div id="loading" class="hidden">
    <div class="spinner"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
